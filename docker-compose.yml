services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@db:5432/scheduler
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy

  # Scale this out to demo distributed execution:
  #   docker compose up --scale worker=3
  worker:
    build: .
    command: python -m worker.main
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@db:5432/scheduler
      WORKER_CONCURRENCY: "4"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s   # let graceful shutdown drain running jobs

volumes:
  pgdata:
